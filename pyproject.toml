[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qqnt-chat-export"
version = "0.1.0"
description = "本地只读的 QQNT 聊天记录导出命令行工具"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "QQNT 聊天记录导出工具贡献者"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: Microsoft :: Windows"]
dependencies = []

[project.optional-dependencies]
decrypt = ["sqlcipher3>=0.6,<1"]
gui = ["PySide6-Essentials>=6.10,<7"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<2"]

[project.scripts]
qqnt-export = "qqnt_export.cli:main"

[project.gui-scripts]
qqnt-export-gui = "qqnt_export.gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qqnt_export = ["resources/*.json", "adapters/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
